# On a version tag (v1.2.3): builds the static library for each platform,
# packages it with the headers and CMake config, signs the build provenance,
# publishes a GitHub release with the notes from CHANGELOG.md, and pushes a
# multi-platform container image to ghcr.io.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    container: nvidia/cuda:${{ matrix.image }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - platform: linux-x86_64-cuda12
            runner: ubuntu-24.04
            image: 12.8.1-devel-ubuntu22.04@sha256:a99a1860ba8e2916e5c3e73b72ec4c4301653a84586e05bfc9a2aa2d58027e97
            gpus: 75-real;80-real;86-real;89-real;90-real;100-real;120-real;120-virtual
          - platform: linux-x86_64-cuda13
            runner: ubuntu-24.04
            image: 13.2.0-devel-ubuntu24.04@sha256:f9492f2eea77fbc3d0c14fa8738f35946b42da72917bf5959d284ca39b4f209a
            gpus: 75-real;80-real;86-real;89-real;90-real;100-real;120-real;120-virtual
          - platform: linux-aarch64-cuda13
            runner: ubuntu-24.04-arm
            image: 13.2.0-devel-ubuntu24.04@sha256:f9492f2eea77fbc3d0c14fa8738f35946b42da72917bf5959d284ca39b4f209a
            gpus: 90-real;100-real;110-real;121-real;121-virtual
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the project version
        run: |
          version=$(sed -n 's/^project(RealtimeHJB VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match CMakeLists.txt version $version"; exit 1; }

      - name: Build and package
        env:
          GPUS: ${{ matrix.gpus }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          pkg="realtime-hjb-${GITHUB_REF_NAME#v}-$PLATFORM"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CUDA_ARCHITECTURES=$GPUS" \
                -DHJB_BUILD_EXAMPLES=OFF -DHJB_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/$pkg"
          cmake --build build -j "$(nproc)"
          cmake --install build
          echo "CUDA architectures: $GPUS" > "$pkg/BUILD_INFO.txt"
          nvcc --version | tail -1 >> "$pkg/BUILD_INFO.txt"
          mkdir dist
          tar -czf "dist/$pkg.tar.gz" "$pkg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: linux-*
          merge-multiple: true

      - name: Source archive and checksums
        run: |
          version=${GITHUB_REF_NAME#v}
          git archive --format=tar.gz --prefix="realtime-hjb-$version/" -o "dist/realtime-hjb-$version-src.tar.gz" HEAD
          cd dist && sha256sum *.tar.gz > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: dist/*.tar.gz

      - name: Attach the signed provenance
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # Sigstore bundle (gh attestation verify --bundle) and the bare
          # DSSE envelope with the in-toto SLSA provenance statement.
          cp "$BUNDLE" "dist/realtime-hjb-$version.sigstore.json"
          jq -c .dsseEnvelope "$BUNDLE" > "dist/realtime-hjb-$version.intoto.jsonl"

      - name: Release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for $version"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "RealtimeHJB ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag

  image:
    name: image ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            gpus: 75-real;80-real;86-real;89-real;90-real;100-real;120-real;120-virtual
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            gpus: 90-real;100-real;110-real;121-real;121-virtual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: CUDA_ARCHS=${{ matrix.gpus }}
          outputs: type=image,name=ghcr.io/mirrorai-corp/realtime-hjb,push-by-digest=true,name-canonical=true,push=true

      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*
          if-no-files-found: error

  image-manifest:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/mirrorai-corp/realtime-hjb
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create the multi-platform image
        id: manifest
        working-directory: digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/mirrorai-corp/realtime-hjb@sha256:%s ' *)
          version=$(jq -r '.labels["org.opencontainers.image.version"]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest=$(docker buildx imagetools inspect "ghcr.io/mirrorai-corp/realtime-hjb:$version" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/mirrorai-corp/realtime-hjb
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
